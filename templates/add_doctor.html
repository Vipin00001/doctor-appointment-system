{% extends "base.html" %}
{% block title %}Add Doctor{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
  <div class="card p-4">
    <h3 class="mb-3">Add Doctor</h3>
    <form method="post" class="row g-3">
      <div class="col-md-6"><label class="form-label">Name</label><input name="name" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label">Email (login id)</label><input type="email" name="email" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control"></div>
      <div class="col-md-6"><label class="form-label">Password</label><input type="password" name="password" class="form-control" minlength="6" required></div>
      <div class="col-md-6"><label class="form-label">Specialization</label><input name="specialization" class="form-control" placeholder="Cardiologist" required></div>
      <div class="col-md-6"><label class="form-label">Qualification</label><input name="qualification" class="form-control" placeholder="MBBS, MD" required></div>
      <div class="col-md-6"><label class="form-label">Experience (years)</label><input type="number" name="experience" min="0" value="0" class="form-control"></div>
      <div class="col-md-6"><label class="form-label">Consultation fee (&#8377;)</label><input type="number" name="fee" min="0" value="500" class="form-control"></div>
      <div class="col-12"><button class="btn btn-primary">Save Doctor</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('admin_dashboard') }}">Back</a></div>
    </form>
  </div>
</div></div>
{% endblock %}
