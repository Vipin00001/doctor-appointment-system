{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card p-4">
    <h3 class="mb-3">Patient Registration</h3>
    <form method="post">
      <div class="mb-3"><label class="form-label">Full name</label>
        <input name="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Phone (10 digits)</label>
        <input name="phone" class="form-control" pattern="\d{10}" maxlength="10"></div>
      <div class="mb-3"><label class="form-label">Password (min 6 characters)</label>
        <input type="password" name="password" class="form-control" minlength="6" required></div>
      <button class="btn btn-primary w-100">Create account</button>
    </form>
  </div>
</div></div>
{% endblock %}
